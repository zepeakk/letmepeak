<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>뮤지컬 렛미플라이 관극 정산판</title>
    <style>
        :root {
            --bg-paper: #f5efe6;
            --card-bg: #ffffff;
            --stitch-border: #e88a99;
            --main-pink: #d9536f;
            --text-dark: #3e3636;
            --text-sub: #7d7373;
            --seat-r: #70a1ff;
            --seat-s: #ff7675;
            --seat-hold: #b2bec3;
            
            /* 관람 횟수별 좌석 색상 */
            --seat-v1: #2ecc71;
            --seat-v2: #9b59b6;
            --seat-v3: #ff7f50;
            
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* 텍스트 드래그 및 길게 누르기 메뉴 방지 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* 입력 폼에서는 텍스트 선택 허용 */
        input, select, textarea {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        body {
            background-color: var(--bg-paper);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220"><g stroke="%23e88a99" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"><path d="M30 40 C30 25, 50 25, 50 40 C50 25, 70 25, 70 40 L65 60 L35 60 Z" fill="%23fdf3f4"/><path d="M35 60 L40 80 L60 80 L65 60"/><circle cx="50" cy="25" r="2.5" fill="%23e88a99"/><path d="M140 30 C140 30, 160 20, 170 35 C180 50, 160 70, 140 60 C130 55, 125 40, 140 30 Z"/><path d="M135 65 L125 75 M155 25 L165 15"/><path d="M130 45 Q150 45 165 50" stroke-dasharray="2 2"/><path d="M45 145 C35 135, 45 120, 55 130 C65 140, 75 125, 65 115" stroke-width="1.5"/><ellipse cx="55" cy="130" rx="12" ry="7" transform="rotate(-30 55 130)" fill="%23fdf3f4"/><path d="M150 130 L180 160 M180 160 L175 168 M180 160 L188 155"/><circle cx="145" cy="125" r="2"/><path d="M150 145 Q160 140 170 145"/><path d="M15 110 Q50 110 80 100" stroke-dasharray="3 3"/><path d="M110 190 Q150 185 200 200" stroke-dasharray="3 3"/><circle cx="185" cy="90" r="1.5" fill="%23e88a99"/><circle cx="90" cy="30" r="1.5" fill="%23e88a99"/><circle cx="100" cy="150" r="1.5" fill="%23e88a99"/></g></svg>');
            background-repeat: repeat;
            background-size: 220px 220px;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            border: 2px dashed var(--stitch-border);
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 10px 0;
            margin-bottom: 12px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 이미지 터치 및 드래그 방지 */
        .header-logo {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .contact-info {
            font-size: 8px;
            color: #a09999;
            margin-top: 6px;
            letter-spacing: -0.2px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ebdcd0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        details summary {
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--main-pink);
            display: flex;
            justify-content: space-between;
            align-items: center;
            outline: none;
            list-style: none;
        }

        details summary::-webkit-details-marker {
            display: none;
        }

        details summary::after {
            content: '▼';
            font-size: 0.7rem;
            color: var(--main-pink);
            transition: transform 0.2s;
        }

        details[open] summary::after {
            content: '▲';
        }

        /* 스케줄 테이블 */
        .table-container {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            border: 1px solid #ebdcd0;
            border-radius: 6px;
            background: #ffffff;
        }

        table.schedule-tbl {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.68rem;
            white-space: nowrap;
            text-align: center;
        }

        table.schedule-tbl th {
            position: sticky;
            top: 0;
            background: #f0eae1;
            padding: 8px 4px;
            z-index: 1;
            border-bottom: 1px solid #dcd1c4;
            font-weight: 700;
        }

        table.schedule-tbl td {
            padding: 8px 4px;
            border-bottom: 1px solid #f2e8df;
            cursor: pointer;
            line-height: 1.3;
        }

        table.schedule-tbl tr:hover { background: #fff0f2; }

        .badge-evt {
            font-size: 0.58rem;
            padding: 2px 4px;
            border-radius: 3px;
            color: white;
            font-weight: bold;
        }
        .bg-prev { background: #8e44ad; }
        .bg-mat { background: #27ae60; }
        .bg-all { background: #2980b9; }

        .tag-first {
            color: var(--main-pink);
            font-weight: bold;
            font-size: 0.60rem;
            margin-left: 2px;
        }

        /* 배우 필터 */
        .filter-box {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #ebdcd0;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            margin-top: 6px;
        }

        .btn-filter {
            background: #f0eae1;
            border: 1px solid #dcd1c4;
            font-size: 0.55rem;
            padding: 4px 0;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
        }

        .btn-filter.active {
            background: var(--main-pink);
            color: white;
            border-color: var(--main-pink);
            font-weight: bold;
        }

        /* 입력 폼 */
        .form-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.65rem;
            color: var(--text-sub);
            margin-bottom: 3px;
        }

        .form-control {
            width: 100%;
            padding: 6px;
            font-size: 0.72rem;
            border: 1px solid #dcd1c4;
            border-radius: 4px;
            background: #faf8f5;
        }

        .btn-sub {
            width: 100%;
            background: var(--main-pink);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.78rem;
            margin-top: 10px;
            cursor: pointer;
        }

        /* 좌석 배치도 */
        .stage {
            background: #d8ceca;
            color: #fff;
            text-align: center;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px;
            margin: 6px 0;
            border-radius: 4px;
            letter-spacing: 2px;
        }

        .seat-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 10px;
            margin-bottom: 8px;
            padding: 5px;
            background: #fdfaf7;
            border-radius: 4px;
            font-size: 0.58rem;
            border: 1px solid #f0eae1;
        }
        .leg-item { display: flex; align-items: center; gap: 3px; }
        .leg-box { width: 8px; height: 8px; border-radius: 2px; }

        .floor-header {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--main-pink);
            margin: 6px 0 4px 0;
        }

        .map-container {
            background: #faf8f5;
            padding: 6px 2px;
            border-radius: 6px;
            border: 1px solid #ebdcd0;
            overflow-x: auto;
        }

        .sec-header-row {
            display: flex;
            font-size: 0.65rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
            text-align: center;
        }

        .seat-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1px;
            margin-bottom: 1.5px;
            height: 9.5px;
        }

        .spacer-row {
            height: 12px;
        }

        .row-label {
            font-size: 0.5rem;
            color: #888;
            width: 14px;
            min-width: 14px;
            max-width: 14px;
            text-align: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .s-btn {
            width: 8.5px;
            height: 8.5px;
            border-radius: 1px;
            cursor: pointer;
            border: none;
            padding: 0;
            font-size: 0.38rem;
            line-height: 8.5px;
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            transition: transform 0.1s;
            flex-shrink: 0;
        }
        .s-btn:hover { transform: scale(1.5); z-index: 2; }
        
        .s-btn.r { background-color: var(--seat-r); }
        .s-btn.s { background-color: var(--seat-s); }
        .s-btn.wc { background-color: var(--seat-r); cursor: pointer; }
        .s-btn.h { background-color: var(--seat-hold); cursor: not-allowed; color: #ffffff; }
        .s-btn.e { background-color: transparent; cursor: default; }

        .s-btn.v1 { background-color: var(--seat-v1) !important; color: #fff; }
        .s-btn.v2 { background-color: var(--seat-v2) !important; color: #fff; }
        .s-btn.v3 { background-color: var(--seat-v3) !important; color: #fff; }

        /* 관극 정산 내역 */
        .summary {
            display: flex;
            justify-content: space-around;
            background: #fdf3f4;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
            text-align: center;
        }
        .sum-val { font-size: 0.85rem; font-weight: bold; color: var(--main-pink); }
        .sum-lbl { font-size: 0.6rem; color: var(--text-sub); }

        .history-item {
            background: #faf8f5;
            border: 1px solid #ebdcd0;
            padding: 6px 8px;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 0.68rem;
        }
        .history-row { display: flex; justify-content: space-between; align-items: center; }

        .status-select {
            font-size: 0.62rem;
            color: var(--main-pink);
            font-weight: bold;
            border: 1px solid var(--stitch-border);
            border-radius: 3px;
            padding: 1px 2px;
            background: #fff;
            margin-right: 4px;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

<div class="container">
    <header>
        <img src="letmeflyrogo.png" alt="LET ME FLY 로고" class="header-logo" oncontextmenu="return false;">
        <p class="contact-info">문의는 @hillpeakk 로 연락 주세요.</p>
    </header>

    <!-- 스케줄 -->
    <div class="card">
        <details open>
            <summary>🧁 회차별 스케줄</summary>

            <div class="table-container">
                <table class="schedule-tbl">
                    <thead>
                        <tr>
                            <th>일자</th>
                            <th>시간</th>
                            <th>노인남원</th>
                            <th>선희</th>
                            <th>청년남원</th>
                            <th>정분</th>
                            <th>이벤트</th>
                        </tr>
                    </thead>
                    <tbody id="sch-tbody"></tbody>
                </table>
            </div>

            <div class="filter-box">
                <div style="font-size: 0.65rem; display: flex; justify-content: space-between;">
                    <span>배우 필터 (최대 2명)</span>
                    <span style="color: var(--main-pink); cursor: pointer; font-weight:bold;" onclick="clearFilter()">초기화</span>
                </div>
                <div class="filter-grid" id="filter-btns"></div>
            </div>
        </details>
    </div>

    <!-- 기록 추가 -->
    <div class="card">
        <details open>
            <summary>🧁 기록 추가</summary>
            <form id="record-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>일자/시간</label>
                        <input type="text" id="f-date" class="form-control" placeholder="스케줄 클릭" required>
                    </div>
                    <div class="form-group">
                        <label>좌석</label>
                        <input type="text" id="f-seat" class="form-control" placeholder="좌석 클릭" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>등급</label>
                        <select id="f-grade" class="form-control" onchange="calcPrice()">
                            <option value="R석">R석 (88,000원)</option>
                            <option value="S석">S석 (66,000원)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>할인 권종</label>
                        <select id="f-discount" class="form-control" onchange="calcPrice()">
                            <option value="0">정가</option>
                            <option value="20">프리뷰 할인 (20%)</option>
                            <option value="20">조기예매 할인 (20%)</option>
                            <option value="20">재관람 할인 (20%)</option>
                            <option value="20">마티네 할인 (20%)</option>
                            <option value="custom">직접 입력</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>최종 결제액</label>
                        <input type="number" id="f-price" class="form-control" placeholder="+2,000원 자동" required>
                    </div>
                    <div class="form-group">
                        <label>캐스팅</label>
                        <input type="text" id="f-cast" class="form-control">
                    </div>
                </div>

                <button type="submit" class="btn-sub">저장하기</button>
            </form>
        </details>
    </div>

    <!-- 관극 정산 내역 -->
    <div class="card">
        <details open>
            <summary>🧁 관극 정산 내역</summary>
            <div class="summary">
                <div><div class="sum-lbl">총 횟수</div><div class="sum-val" id="cnt">0회</div></div>
                <div><div class="sum-lbl">총 금액</div><div class="sum-val" id="amt">0원</div></div>
            </div>
            <div id="history-list"></div>
        </details>
    </div>

    <!-- 좌석 배치도 -->
    <div class="card">
        <details open>
            <summary>🧁 좌석 배치도</summary>
            
            <div class="stage">STAGE</div>

            <div class="seat-legend">
                <div class="leg-item"><div class="leg-box" style="background:var(--seat-r);"></div> R석</div>
                <div class="leg-item"><div class="leg-box" style="background:var(--seat-s);"></div> S석</div>
                <div class="leg-item"><div class="leg-box" style="background:var(--seat-hold);"></div> 미판매보류석</div>
                <div class="leg-item"><div class="leg-box" style="background:var(--seat-v1);"></div> 1회 관람</div>
                <div class="leg-item"><div class="leg-box" style="background:var(--seat-v2);"></div> 2회 관람</div>
                <div class="leg-item"><div class="leg-box" style="background:var(--seat-v3);"></div> 3회+ 관람</div>
            </div>

            <!-- 1층 -->
            <div class="floor-header">1F</div>
            <div class="map-container">
                <div class="sec-header-row">
                    <span style="width:105px;">A</span>
                    <span style="width:14px;"></span>
                    <span style="width:135px;">B</span>
                    <span style="width:14px;"></span>
                    <span style="width:105px;">C</span>
                </div>
                <div id="map-1f"></div>
            </div>

            <!-- 2층 -->
            <div class="floor-header">2F</div>
            <div class="map-container">
                <div class="sec-header-row">
                    <span style="width:105px;">D</span>
                    <span style="width:14px;"></span>
                    <span style="width:170px;">E</span>
                    <span style="width:14px;"></span>
                    <span style="width:120px;">F</span>
                </div>
                <div id="map-2f"></div>
            </div>
        </details>
    </div>
</div>

        btn.onclick = () => {
            if(filter.includes(rawName)) filter = filter.filter(a => a !== rawName);

    });

    function renderSch() {
        const tbody = document.getElementById('sch-tbody');
        tbody.innerHTML = '';
        schedules.filter(s => filter.every(a => s.cast.includes(a))).forEach((s) => {
            const originalIndex = schedules.indexOf(s);
            const tr = document.createElement('tr');
            tr.onclick = () => {
                document.getElementById('f-date').value = `${s.date} ${s.time}`;
                document.getElementById('f-cast').value = s.cast.join(', ');
            };

            let badgeHtml = s.evt;
            if(s.evt.includes('프리뷰')) badgeHtml = `<span class="badge-evt bg-prev">${s.evt}</span>`;
            else if(s.evt.includes('마티네')) badgeHtml = `<span class="badge-evt bg-mat">${s.evt}</span>`;
            else if(s.evt.includes('전관')) badgeHtml = `<span class="badge-evt bg-all">${s.evt}</span>`;

            const castHtmls = s.cast.map(actor => {
                if (originalIndex <= 3 && firstShowIndices[actor] === originalIndex) {
                    return `${actor}<span class="tag-first">첫공</span>`;
                }
                return actor;
            });

            tr.innerHTML = `
                <td><b>${s.date}</b></td>
                <td>${s.time}</td>
                <td>${castHtmls[0]}</td>
                <td>${castHtmls[1]}</td>
                <td>${castHtmls[2]}</td>
                <td>${castHtmls[3]}</td>
                <td>${badgeHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function calcPrice() {
        const dis = document.getElementById('f-discount').value;
        const priceEl = document.getElementById('f-price');
        
        if(dis === 'custom') {
            priceEl.readOnly = false;
            priceEl.focus();
            return;
        }
        
        priceEl.readOnly = true;
        const grade = document.getElementById('f-grade').value;
        const base = (grade === 'R석') ? 88000 : 66000;
        priceEl.value = (base * (1 - Number(dis)/100)) + 2000;

    function createRowLabel(num) {
        const span = document.createElement('span');
        span.className = 'row-label';
        span.textContent = num;
        return span;
    }

    function createSeatBtn(st, areaName, rowNum, defaultGrade) {
        const btn = document.createElement('button');
        if (st.t === 'e') {
            btn.className = 's-btn e';
        } else {
            btn.className = `s-btn ${st.t}`;
            
            if (st.lbl) {
                btn.textContent = st.lbl;
            } else if (st.n) {
                btn.textContent = st.n;
            }

            if (st.n) {
                const isWcNum = typeof st.n === 'string' && st.n.startsWith('h');
                const seatLabel = isWcNum ? `${st.n}번` : `${st.n}번`;
                const seatId = `${areaName} ${rowNum}열 ${seatLabel}`;
                btn.dataset.seatId = seatId;
            }
            if (st.t !== 'h') {
                const isWcNum = typeof st.n === 'string' && st.n.startsWith('h');
                const seatLabel = isWcNum ? `${st.n}번` : `${st.n}번`;
                btn.onclick = () => pickSeat(`${areaName} ${rowNum}열 ${seatLabel}`, defaultGrade);
            }
        }
        return btn;
    }

    function applySeatColors() {
        const seatCounts = {};
        historyData.forEach(h => {
            if (h.seat && h.status !== '양도') {
                seatCounts[h.seat] = (seatCounts[h.seat] || 0) + 1;
            }
        });

        document.querySelectorAll('.s-btn[data-seat-id]').forEach(btn => {
            const sid = btn.dataset.seatId;
            btn.classList.remove('v1', 'v2', 'v3');
            if (seatCounts[sid]) {
                const count = seatCounts[sid];
                if (count === 1) btn.classList.add('v1');
                else if (count === 2) btn.classList.add('v2');
                else if (count >= 3) btn.classList.add('v3');
            }
        });
    }

    /* LocalStorage 관련 데이터 로드 및 저장 함수 */
    function loadData() {
        const saved = localStorage.getItem('lmf_history_data');
        return saved ? JSON.parse(saved) : [];
    }

    function saveData() {
        localStorage.setItem('lmf_history_data', JSON.stringify(historyData));
    }

    let historyData = loadData();

    document.getElementById('record-form').onsubmit = function(e) {
        e.preventDefault();
        
        const date = document.getElementById('f-date').value;
        const seat = document.getElementById('f-seat').value;
        const price = Number(document.getElementById('f-price').value) || 0;
        const cast = document.getElementById('f-cast').value;

        historyData.push({
            id: Date.now(),
            date: date,
            seat: seat,
            status: "-",
            price: price,
            cast: cast
        });

        saveData();
        sortAndRenderHistory();
        applySeatColors();

        document.getElementById('f-seat').value = '';
        document.getElementById('f-date').value = '';
        document.getElementById('f-cast').value = '';
    };

    function parseSeatInfo(seatStr) {
        if (!seatStr) return { floor: 99, area: 'Z', row: 99, num: 99 };
        
        const floorMatch = seatStr.match(/(\d+)층/);
        const areaMatch = seatStr.match(/([A-Z])구역/);
        const rowMatch = seatStr.match(/(\d+)열/);
        const numMatch = seatStr.match(/(\d+|h\d+)번/);

        let numVal = 99;
        if (numMatch) {
            if (numMatch[1].startsWith('h')) {
                numVal = parseInt(numMatch[1].replace('h', ''), 10) - 100;
            } else {
                numVal = parseInt(numMatch[1], 10);
            }
        }

        return {
            floor: floorMatch ? parseInt(floorMatch[1], 10) : 99,
            area: areaMatch ? areaMatch[1] : 'Z',
            row: rowMatch ? parseInt(rowMatch[1], 10) : 99,
            num: numVal
        };
    }

    function sortAndRenderHistory() {
        historyData.sort((a, b) => {
            if (a.date !== b.date) {
                return a.date.localeCompare(b.date);
            }

            const sA = parseSeatInfo(a.seat);
            const sB = parseSeatInfo(b.seat);

            if (sA.floor !== sB.floor) return sA.floor - sB.floor;
            if (sA.row !== sB.row) return sA.row - sB.row;
            if (sA.area !== sB.area) return sA.area.localeCompare(sB.area);
            return sA.num - sB.num;
        });

        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        let total = 0;
        let activeCount = 0;
        
        historyData.forEach(h => {
            if (h.status !== '양도') {
                total += h.price;
                activeCount++;
            }

            const item = document.createElement('div');
            item.className = 'history-item';
            
            const isTransferred = h.status === '양도';
            const priceTextStyle = isTransferred ? 'text-decoration: line-through; color:#aaa;' : '';

            item.innerHTML = `
                <div class="history-row">
                    <b style="color:var(--text-dark);">${h.date}</b>
                    <div>
                        <select class="status-select" onchange="updateStatus(${h.id}, this.value)">
                            <option value="-" ${h.status==='-'?'selected':''}>-</option>
                            <option value="양도" ${h.status==='양도'?'selected':''}>양도</option>
                            <option value="양수" ${h.status==='양수'?'selected':''}>양수</option>
                            <option value="나눔" ${h.status==='나눔'?'selected':''}>나눔</option>
                        </select>
                        <b style="${priceTextStyle}">${h.price.toLocaleString()}원</b>
                    </div>
                </div>
                <div class="history-row" style="margin-top:4px;">
                    <span style="color:var(--text-sub);">${h.seat} | ${h.cast}</span>
                    <span style="color:#d9536f; cursor:pointer; font-weight:bold;" onclick="delHist(${h.id})">삭제</span>
                </div>
            `;
            list.appendChild(item);
        });

        document.getElementById('cnt').textContent = activeCount + '회';
        document.getElementById('amt').textContent = total.toLocaleString() + '원';
    }

    function updateStatus(id, newStatus) {
        const target = historyData.find(h => h.id === id);
        if (target) {
            target.status = newStatus;
            saveData();
        }
        renderHistory();
        applySeatColors();
    }

    function delHist(id) {
        historyData = historyData.filter(h => h.id !== id);
        saveData();
        sortAndRenderHistory();
        applySeatColors();
    }

    renderSch();
    calcPrice();
    renderMap();
    sortAndRenderHistory();
